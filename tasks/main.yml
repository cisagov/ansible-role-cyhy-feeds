---
#
# Grab the cyhy-feeds code
#
- name: Create the /var/local/cyhy/feeds directory
  ansible.builtin.file:
    group: "{{ cyhy_feeds_file_owner_group | default(omit) }}"
    mode: u=rwx,g=rx,o=rx
    owner: "{{ cyhy_feeds_file_owner_username | default(omit) }}"
    path: /var/local/cyhy/feeds
    state: directory

- name: Download and untar the cyhy-feeds tarball
  ansible.builtin.unarchive:
    dest: /var/local/cyhy/feeds
    extra_opts:
      - --strip-components=1
    group: "{{ cyhy_feeds_file_owner_group | default(omit) }}"
    owner: "{{ cyhy_feeds_file_owner_username | default(omit) }}"
    remote_src: true
    src: https://api.github.com/repos/cisagov/cyhy-feeds/tarball/develop

- name: Create the /var/cyhy/scripts/cyhy-feeds/cyhy_extracts directory
  ansible.builtin.file:
    group: "{{ cyhy_feeds_file_owner_group | default(omit) }}"
    mode: u=rwx,g=rx,o=rx
    owner: "{{ cyhy_feeds_file_owner_username | default(omit) }}"
    path: /var/cyhy/scripts/cyhy-feeds/cyhy_extracts
    state: directory

- name: Copy the extract scripts
  ansible.builtin.copy:
    dest: /var/cyhy/scripts/cyhy-feeds/{{ item }}
    group: "{{ cyhy_feeds_file_owner_group | default(omit) }}"
    mode: u=rwx,g=rx,o=rx
    owner: "{{ cyhy_feeds_file_owner_username | default(omit) }}"
    remote_src: true
    src: /var/local/cyhy/feeds/aws_jobs/{{ item }}
  loop:
    - cyhy-data-extract.py
    - dmarc.py

- name: Install dependencies required by the extract scripts
  ansible.builtin.package:
    name:
      - gnupg2
      - unzip

- name: Install other pip dependencies through requirements.txt
  ansible.builtin.pip:
    chdir: /var/local/cyhy/feeds
    executable: pip3
    # The extra --break-system-packages argument is necessary on modern
    # platforms, which correctly recognize that the local Python is externally
    # managed (i.e. managed via the system package manager and not by pip).
    #
    # For Debian Buster, we upgrade pip3 in ansible-role-pip to get a version
    # new enough to support pyproject.toml. In that case, we add
    # --ignore-installed to work around dependency install behavior on Buster.
    extra_args: >-
      {{
        '--break-system-packages --ignore-installed'
        if (ansible_distribution == 'Debian' and
            ansible_distribution_release == 'buster')
        else (
          '--break-system-packages'
          if (ansible_distribution in ['Kali']
              or (ansible_distribution in ['Debian', 'Ubuntu']
                  and ansible_distribution_release not in ['bullseye']))
          else omit
        )
      }}
    requirements: requirements.txt
